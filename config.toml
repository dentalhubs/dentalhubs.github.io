# ============================================
# SITE CONFIGURATION - DentalHubs
# ============================================
baseURL = "https://dentalhubs.github.io/"
languageCode = "en"
defaultContentLanguage = "en"
title = "DentalHubs"
hasCJKLanguage = false
enableRobotsTXT = true
enableGitInfo = false
enableEmoji = true

# Sitemap Configuration
[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

# ============================================
# LANGUAGE SETTINGS
# ============================================
[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    title = "DentalHubs"
    
    [languages.en.params]
      description = "Specialized Web Solutions for Dental Professionals. Clinics, Labs, Stores, and Portfolios."
    
  [languages.ar]
    languageName = "العربية"
    weight = 2
    languageDirection = "rtl"
    title = "دينتال هبز | حلول ويب طبية"
    
    [languages.ar.params]
      description = "حلول برمجية متخصصة لقطاع طب الأسنان. عيادات، معامل، متاجر، ومواقع شخصية للأطباء."

# ============================================
# AUTHOR & SOCIAL
# ============================================
[params]
  author = "DentalHubs Team"
  job_title_en = "Dental Web Specialists"
  job_title_ar = "متخصصون في الويب الطبي"
  avatar = "/assets/avatar.jpg"
  
  [params.social]
    linkedin = "https://www.linkedin.com/in/michael-nabil-dev/"
    github = "https://github.com/yourusername"
    twitter = "https://twitter.com/yourhandle"

# ============================================
# STYLE SYSTEM - Blue Premium (KEPT AS IS)
# ============================================
[params.style]
  # Light Mode Colors
  bg_primary_light = "#FFFFFF"
  bg_secondary_light = "#F8FAFC"
  bg_surface_light = "#F1F5F9"
  text_primary_light = "#0F172A"
  text_secondary_light = "#475569"
  text_muted_light = "#94A3B8"
  border_light = "#E2E8F0"
  
  # Dark Mode Colors
  bg_primary_dark = "#020617"
  bg_secondary_dark = "#0F172A"
  bg_surface_dark = "#1E293B"
  text_primary_dark = "#F8FAFC"
  text_secondary_dark = "#CBD5E1"
  text_muted_dark = "#64748B"
  border_dark = "#334155"
  
  # Brand Colors
  brand_primary = "#3B82F6"
  brand_secondary = "#60A5FA"
  brand_accent = "#2563EB"
  brand_dark = "#1E40AF"
  
  # Status Colors
  success = "#10B981"
  warning = "#F59E0B"
  error = "#EF4444"
  
  # Fonts
  font_primary = "'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif"
  font_arabic = "'Cairo', 'Tajawal', sans-serif"
  font_mono = "'Courier New', monospace"

